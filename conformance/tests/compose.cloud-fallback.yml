# Scenario override (on top of compose.conformance.yml): cloud fallback when the local model is down.
#   conformance/tests/prepare_cloud_scenario.sh
#   docker compose -f docker-compose.yml -f conformance/tests/compose.conformance.yml \
#     -f conformance/tests/compose.cloud-fallback.yml up -d governance-proxy orchestrator aism-mock mock-cloud llama-mock
#   docker compose ... stop llama-mock                       # local model "down"
#   docker compose ... --profile runner run --rm aism-runner scenario_cloud_fallback.py
# Test doubles only. Never use in production.
services:
  llama-mock:            # stands in for llama-server (S6); stopped during the scenario
    image: python:3.12-slim@sha256:02108f5d322dd89f1c9e552442c25acb0543dfdbc455693a5599624f20d9155d
    command: ["python3", "/mock/mock_upstream.py", "--host", "0.0.0.0", "--port", "18081"]
    volumes:
      - ./conformance/tests/mock_upstream.py:/mock/mock_upstream.py:ro
    networks: [backend]

  mock-cloud:            # "cloud provider" on the egress network, HTTPS with a test CA
    image: python:3.12-slim@sha256:02108f5d322dd89f1c9e552442c25acb0543dfdbc455693a5599624f20d9155d
    command: ["python3", "/mock/mock_upstream.py", "--host", "0.0.0.0", "--port", "8443",
              "--capture-host", "0.0.0.0", "--capture-port", "18082",
              "--tls-cert", "/tls/server.pem", "--tls-key", "/tls/server.key"]
    volumes:
      - ./conformance/tests/mock_upstream.py:/mock/mock_upstream.py:ro
      - ./conformance/tests/run/tls:/tls:ro
    networks:
      egress: {}
      frontend: {}       # only so that the test runner can read /_captured (port 18082)

  governance-proxy:
    environment:
      AISM_CA_BUNDLE: /tls/ca.pem         # trust the test CA (TLS verification stays on)
      AISM_CLOUD_API_KEY: aism-test-cloud-key
    volumes:
      - ./conformance/tests/run/policy-cloud:/etc/aism/policy:ro
      - ./conformance/tests/run/tls/ca.pem:/tls/ca.pem:ro

  orchestrator:
    environment:
      INFERENCE_LOCAL_URL: http://llama-mock:18081/v1
    volumes:
      - ./conformance/tests/run/policy-cloud:/etc/aism/policy:ro

  aism-runner:
    environment:
      AISM_POLICY_FILE: /repo/conformance/tests/run/policy-cloud/policy.yaml
      AISM_POLICY_FAULT_INJECTION: "0"
      AISM_CLOUD_MOCK_URL: http://mock-cloud:18082
      AISM_LOCAL_DOWN: "1"
