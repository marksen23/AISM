[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra
markers =
    aism(id, level, req, refs): AISM conformance test metadata (id, level K1-K3, req MUSS|SOLLTE, spec refs)
    live: requires a running AISM stack (AISM_BASE_URL)
    capture: requires the capture mock upstream (AISM_MOCK_URL)
    audit: requires read access to the audit log (AISM_AUDIT_LOG)
    static: checks repository files only (compose, policy)
    inject: opt-in fault injection (modifies files, e.g. AISM_POLICY_FAULT_INJECTION=1)
