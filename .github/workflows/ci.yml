name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          python -m pip install -r gateway/requirements.txt -r orchestrator/requirements.txt
      - name: Ruff
        run: bash tools/ci-local.sh lint
      - name: Unit tests
        run: bash tools/ci-local.sh unit
      - name: Policy schema
        run: bash tools/ci-local.sh policy
      - name: Policy signature
        run: bash tools/ci-local.sh signature
      - name: PII recall gate
        run: bash tools/ci-local.sh pii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pii-eval
          path: conformance/pii-eval/results-ci.json
          if-no-files-found: warn

  pii-cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            gateway/requirements-gliner.txt
      - name: Cache the GLiNER model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gliner-multi-pii-v1-${{ hashFiles('gateway/requirements-gliner.txt') }}
      - name: Install gateway and optional GLiNER dependencies
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r gateway/requirements.txt -r gateway/requirements-gliner.txt
      - name: Prefetch GLiNER
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -c "from gliner import GLiNER; GLiNER.from_pretrained('urchade/gliner_multi_pii-v1')"
      - name: Cascade recall gates (v2 and frozen v3)
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: bash tools/ci-local.sh pii-cascade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pii-eval-cascade
          path: |
            conformance/pii-eval/results-ci-cascade-v2.json
            conformance/pii-eval/results-ci-cascade-v3.json
          if-no-files-found: warn

  reproducible-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Create the reproducible builder
        run: docker buildx inspect aism-repro >/dev/null 2>&1 || docker buildx create --name aism-repro --driver docker-container
      - name: Build gateway and orchestrator twice
        run: bash tools/ci-local.sh repro

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install policy signing dependencies
        run: python -m pip install "PyYAML==6.0.3" "cryptography==50.0.2"
      - name: Conformance suite
        run: bash tools/ci-local.sh conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: conformance/reports/ci/**
          if-no-files-found: warn
